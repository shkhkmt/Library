<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library</title>
  <link rel="stylesheet" href="./styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="main">
    <div class="header">
      <h1>Library</h1>
      <button id="btnAddBook" command="show-modal" commandfor="addBook">New Book</button> 
      <dialog id="addBook"> 
        <form action="" method="post" id="bookForm"> 
        <div>
           <label for="title">Title:</label>
           <input type="text" id="title" name="title" required>
        </div> 
        <div>
          <label for="author">Author:</label> 
          <input type="text" id="author" name="author" required> 
        </div> 
        <div>
          <label for="pages">Pages:</label>
          <input type="number" id="pages" name="pages" required>
        </div> 
        <div> 
         <label for="read">Read:</label>
         <input type="checkbox" id="read" Name="read" value="read" required>
        </div> 
         <button type="button" commandfor="addBook" command="close" id="newBook">Submit</button>
        </form> 
      </dialog> 
    </div>
    <div class="content">
    </div>
  </div>
 <script src="./library.js" defer></script> 
</body>
</html>
